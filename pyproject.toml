[project]
name = "option-pricer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ilyass Kone", email = "ilyasskone@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/option_pricer"]
cmake.build-type = "Release"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cpp/**/*.cpp" },
    { file = "cpp/**/*.hpp" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
